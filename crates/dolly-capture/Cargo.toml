[package]
name = "dolly-capture"
description = "Screen capture + raw input logging. Windows.Graphics.Capture backend, mock backend for dev"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dolly-core = { path = "../dolly-core" }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-capture = { version = "2.0", optional = true }
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    # Only the ignored smoke test injects input; the recorder itself never does.
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
] }

[features]
default = []
win-capture = ["dep:windows-capture", "dep:windows"]
